<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" style="background:#0b0d17;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <rect x="40" y="35" width="1120" height="830" rx="16" fill="#101322" stroke="#1c223a" stroke-width="1.5"/>
  <!-- Top bar -->
  <rect x="40" y="35" width="1120" height="52" rx="16" fill="#14182b"/>
  <circle cx="74" cy="61" r="6" fill="#ef4444"/>
  <circle cx="96" cy="61" r="6" fill="#eab308"/>
  <circle cx="118" cy="61" r="6" fill="#22c55e"/>
  <text x="150" y="66" fill="#ffffff" font-size="16" font-weight="700">Sai Database Architect</text>
  <text x="320" y="66" fill="#64748b" font-size="14">/ PostgreSQL &amp; SQLite Schema Visualizer + Migrations</text>

  <!-- ER Diagram Canvas -->
  <!-- Table 1: users -->
  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="280" height="220" rx="10" fill="#161b2e" stroke="#3b82f6" stroke-width="1.5" filter="drop-shadow(0 10px 25px rgba(0,0,0,0.5))"/>
    <rect x="0" y="0" width="280" height="38" rx="10" fill="#1d243d"/>
    <text x="20" y="24" fill="#ffffff" font-size="14" font-weight="700">🗄️ users</text>
    
    <text x="20" y="65" fill="#eab308" font-size="12" font-family="monospace">PK</text>
    <text x="55" y="65" fill="#ffffff" font-size="12" font-family="monospace">id</text>
    <text x="180" y="65" fill="#64748b" font-size="12" font-family="monospace">uuid</text>

    <text x="55" y="95" fill="#ffffff" font-size="12" font-family="monospace">email</text>
    <text x="180" y="95" fill="#64748b" font-size="12" font-family="monospace">varchar(255)</text>

    <text x="55" y="125" fill="#ffffff" font-size="12" font-family="monospace">password_hash</text>
    <text x="180" y="125" fill="#64748b" font-size="12" font-family="monospace">text</text>

    <text x="55" y="155" fill="#ffffff" font-size="12" font-family="monospace">role</text>
    <text x="180" y="155" fill="#64748b" font-size="12" font-family="monospace">user_role_enum</text>

    <text x="55" y="185" fill="#ffffff" font-size="12" font-family="monospace">created_at</text>
    <text x="180" y="185" fill="#64748b" font-size="12" font-family="monospace">timestamptz</text>
  </g>

  <!-- Table 2: organizations -->
  <g transform="translate(460, 120)">
    <rect x="0" y="0" width="280" height="190" rx="10" fill="#161b2e" stroke="#a855f7" stroke-width="1.5" filter="drop-shadow(0 10px 25px rgba(0,0,0,0.5))"/>
    <rect x="0" y="0" width="280" height="38" rx="10" fill="#221d3d"/>
    <text x="20" y="24" fill="#ffffff" font-size="14" font-weight="700">🏢 organizations</text>
    
    <text x="20" y="65" fill="#eab308" font-size="12" font-family="monospace">PK</text>
    <text x="55" y="65" fill="#ffffff" font-size="12" font-family="monospace">id</text>
    <text x="180" y="65" fill="#64748b" font-size="12" font-family="monospace">uuid</text>

    <text x="55" y="95" fill="#ffffff" font-size="12" font-family="monospace">name</text>
    <text x="180" y="95" fill="#64748b" font-size="12" font-family="monospace">varchar(120)</text>

    <text x="55" y="125" fill="#ffffff" font-size="12" font-family="monospace">tier</text>
    <text x="180" y="125" fill="#64748b" font-size="12" font-family="monospace">plan_tier</text>

    <text x="55" y="155" fill="#ffffff" font-size="12" font-family="monospace">credits</text>
    <text x="180" y="155" fill="#64748b" font-size="12" font-family="monospace">bigint</text>
  </g>

  <!-- Table 3: projects -->
  <g transform="translate(840, 120)">
    <rect x="0" y="0" width="280" height="220" rx="10" fill="#161b2e" stroke="#10b981" stroke-width="1.5" filter="drop-shadow(0 10px 25px rgba(0,0,0,0.5))"/>
    <rect x="0" y="0" width="280" height="38" rx="10" fill="#172a24"/>
    <text x="20" y="24" fill="#ffffff" font-size="14" font-weight="700">🚀 projects</text>
    
    <text x="20" y="65" fill="#eab308" font-size="12" font-family="monospace">PK</text>
    <text x="55" y="65" fill="#ffffff" font-size="12" font-family="monospace">id</text>
    <text x="180" y="65" fill="#64748b" font-size="12" font-family="monospace">uuid</text>

    <text x="20" y="95" fill="#38bdf8" font-size="12" font-family="monospace">FK</text>
    <text x="55" y="95" fill="#ffffff" font-size="12" font-family="monospace">org_id</text>
    <text x="180" y="95" fill="#64748b" font-size="12" font-family="monospace">uuid</text>

    <text x="55" y="125" fill="#ffffff" font-size="12" font-family="monospace">title</text>
    <text x="180" y="125" fill="#64748b" font-size="12" font-family="monospace">text</text>

    <text x="55" y="155" fill="#ffffff" font-size="12" font-family="monospace">status</text>
    <text x="180" y="155" fill="#64748b" font-size="12" font-family="monospace">varchar(32)</text>

    <text x="55" y="185" fill="#ffffff" font-size="12" font-family="monospace">repo_url</text>
    <text x="180" y="185" fill="#64748b" font-size="12" font-family="monospace">text</text>
  </g>

  <!-- Connective Schema Relationship Lines -->
  <path d="M 360 215 L 460 215" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
  <circle cx="360" cy="215" r="4" fill="#3b82f6"/>
  <circle cx="460" cy="215" r="4" fill="#3b82f6"/>

  <path d="M 740 215 L 840 215" stroke="#a855f7" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
  <circle cx="740" cy="215" r="4" fill="#a855f7"/>
  <circle cx="840" cy="215" r="4" fill="#a855f7"/>

  <!-- Bottom: Auto-Generated SQL Migration Console -->
  <g transform="translate(80, 410)">
    <rect x="0" y="0" width="1040" height="410" rx="12" fill="#080a13" stroke="#1c2238"/>
    <rect x="0" y="0" width="1040" height="40" rx="12" fill="#121626"/>
    <text x="20" y="25" fill="#94a3b8" font-size="12" font-family="monospace">Generated Migration: 0042_cluster_relational_schema.sql</text>
    <rect x="920" y="8" width="100" height="24" rx="4" fill="#10b981"/>
    <text x="932" y="24" fill="#ffffff" font-size="11" font-weight="700">Apply Schema</text>

    <text x="25" y="75" fill="#38bdf8" font-size="13" font-family="monospace">-- 1. Create Projects Table with Foreign Key Cascading</text>
    <text x="25" y="105" fill="#f43f5e" font-size="13" font-family="monospace">CREATE TABLE IF NOT EXISTS</text>
    <text x="240" y="105" fill="#eab308" font-size="13" font-family="monospace">projects</text>
    <text x="310" y="105" fill="#cbd5e1" font-size="13" font-family="monospace"> (</text>
    
    <text x="45" y="135" fill="#ffffff" font-size="13" font-family="monospace">id UUID PRIMARY KEY DEFAULT gen_random_uuid(),</text>
    <text x="45" y="165" fill="#ffffff" font-size="13" font-family="monospace">org_id UUID REFERENCES organizations(id) ON DELETE CASCADE,</text>
    <text x="45" y="195" fill="#ffffff" font-size="13" font-family="monospace">title TEXT NOT NULL,</text>
    <text x="45" y="225" fill="#ffffff" font-size="13" font-family="monospace">created_at TIMESTAMPTZ DEFAULT clock_timestamp()</text>
    <text x="25" y="255" fill="#cbd5e1" font-size="13" font-family="monospace">);</text>

    <text x="25" y="295" fill="#38bdf8" font-size="13" font-family="monospace">-- 2. Performance B-Tree Composite Indexing</text>
    <text x="25" y="325" fill="#f43f5e" font-size="13" font-family="monospace">CREATE INDEX</text>
    <text x="135" y="325" fill="#ffffff" font-size="13" font-family="monospace">idx_projects_org_status </text>
    <text x="320" y="325" fill="#f43f5e" font-size="13" font-family="monospace">ON</text>
    <text x="350" y="325" fill="#eab308" font-size="13" font-family="monospace">projects</text>
    <text x="420" y="325" fill="#cbd5e1" font-size="13" font-family="monospace">(org_id, status);</text>

    <rect x="25" y="350" width="990" height="40" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1"/>
    <text x="40" y="375" fill="#34d399" font-size="12" font-weight="600" font-family="monospace">✓ Schema verified: Zero breaking changes. Backward compatibility 100%.</text>
  </g>
</svg>