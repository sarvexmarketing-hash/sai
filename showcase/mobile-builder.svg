<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" style="background:#0b0e18;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <!-- Background Glow -->
  <circle cx="380" cy="450" r="260" fill="#6366f1" opacity="0.1" filter="blur(60px)"/>
  <circle cx="820" cy="450" r="260" fill="#ec4899" opacity="0.1" filter="blur(60px)"/>

  <rect x="40" y="35" width="1120" height="830" rx="16" fill="#101424" stroke="#1c223a" stroke-width="1.5"/>
  <!-- Top bar -->
  <rect x="40" y="35" width="1120" height="56" rx="16" fill="#15192c"/>
  <circle cx="74" cy="63" r="6" fill="#ef4444"/>
  <circle cx="96" cy="63" r="6" fill="#eab308"/>
  <circle cx="118" cy="63" r="6" fill="#22c55e"/>
  <text x="150" y="68" fill="#ffffff" font-size="16" font-weight="700">Sai Mobile Studio</text>
  <text x="290" y="68" fill="#64748b" font-size="14">/ Cross-Platform React Native &amp; Flutter Native Engine</text>

  <!-- Device 1: iPhone 16 Pro (iOS) Mockup -->
  <g transform="translate(180, 115)">
    <rect x="0" y="0" width="360" height="720" rx="44" fill="#000000" stroke="#333a52" stroke-width="4" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.8))"/>
    <!-- Dynamic Island -->
    <rect x="115" y="15" width="130" height="32" rx="16" fill="#121212"/>
    <circle cx="140" cy="31" r="5" fill="#22c55e"/>
    <text x="155" y="35" fill="#ffffff" font-size="11" font-weight="600">Sai Pay Active</text>

    <!-- Screen Content -->
    <text x="30" y="85" fill="#94a3b8" font-size="13">Good Morning,</text>
    <text x="30" y="110" fill="#ffffff" font-size="20" font-weight="700">Alex Morgan</text>

    <!-- Credit / Balance Card -->
    <rect x="25" y="130" width="310" height="175" rx="20" fill="#1e2540" stroke="#3b82f6" stroke-width="1"/>
    <text x="45" y="165" fill="#94a3b8" font-size="12">Total Liquid Balance</text>
    <text x="45" y="205" fill="#ffffff" font-size="32" font-weight="800">,290.40</text>
    <text x="45" y="240" fill="#10b981" font-size="13" font-weight="600">▲ +,400.00 this week</text>
    <text x="45" y="280" fill="#64748b" font-size="12" font-family="monospace">•••• •••• •••• 9842 (Virtual Visa)</text>

    <!-- Quick Action Icons -->
    <g transform="translate(25, 325)">
      <rect x="0" y="0" width="68" height="68" rx="16" fill="#171c2e"/>
      <text x="24" y="42" fill="#38bdf8" font-size="24">⚡</text>
      <text x="18" y="88" fill="#cbd5e1" font-size="11">Send</text>

      <rect x="80" y="0" width="68" height="68" rx="16" fill="#171c2e"/>
      <text x="104" y="42" fill="#10b981" font-size="24">📥</text>
      <text x="92" y="88" fill="#cbd5e1" font-size="11">Request</text>

      <rect x="160" y="0" width="68" height="68" rx="16" fill="#171c2e"/>
      <text x="184" y="42" fill="#a855f7" font-size="24">📊</text>
      <text x="175" y="88" fill="#cbd5e1" font-size="11">Invest</text>

      <rect x="240" y="0" width="68" height="68" rx="16" fill="#171c2e"/>
      <text x="264" y="42" fill="#ec4899" font-size="24">💳</text>
      <text x="255" y="88" fill="#cbd5e1" font-size="11">Cards</text>
    </g>

    <!-- Recent Transactions List -->
    <text x="30" y="450" fill="#ffffff" font-size="15" font-weight="600">Recent Transactions</text>
    
    <g transform="translate(25, 465)">
      <rect x="0" y="0" width="310" height="55" rx="12" fill="#14192b"/>
      <text x="15" y="34" fill="#ffffff" font-size="13" font-weight="600">Apple Developer Program</text>
      <text x="235" y="34" fill="#ef4444" font-size="13" font-weight="600">-.00</text>
    </g>
    <g transform="translate(25, 530)">
      <rect x="0" y="0" width="310" height="55" rx="12" fill="#14192b"/>
      <text x="15" y="34" fill="#ffffff" font-size="13" font-weight="600">Stripe Payout - SaaS</text>
      <text x="225" y="34" fill="#10b981" font-size="13" font-weight="600">+,250.00</text>
    </g>

    <!-- Home Indicator -->
    <rect x="110" y="695" width="140" height="4" rx="2" fill="#ffffff" fill-opacity="0.6"/>
  </g>

  <!-- Device 2: Android Pixel 9 Pro Mockup -->
  <g transform="translate(660, 115)">
    <rect x="0" y="0" width="360" height="720" rx="40" fill="#05070d" stroke="#2c344d" stroke-width="4" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.8))"/>
    <circle cx="180" cy="22" r="6" fill="#1c2030"/>

    <!-- E-Commerce / SaaS Mobile App Content -->
    <rect x="25" y="45" width="310" height="45" rx="22" fill="#14192c" stroke="#242d4a"/>
    <text x="50" y="73" fill="#94a3b8" font-size="13">🔍 Search 10,000+ AI Products...</text>

    <!-- Product Card 1 -->
    <rect x="25" y="110" width="310" height="240" rx="16" fill="#161c30" stroke="#283254"/>
    <rect x="45" y="125" width="270" height="130" rx="12" fill="#0c101c"/>
    <text x="110" y="195" fill="#6366f1" font-size="14" font-weight="600">✨ Spatial Audio Pro</text>
    <text x="45" y="285" fill="#ffffff" font-size="17" font-weight="700">Studio Neural Headset X</text>
    <text x="45" y="315" fill="#10b981" font-size="20" font-weight="800">.00</text>
    <rect x="205" y="295" width="110" height="35" rx="8" fill="#6366f1"/>
    <text x="225" y="318" fill="#ffffff" font-size="12" font-weight="600">Add to Cart</text>

    <!-- Product Card 2 -->
    <rect x="25" y="370" width="310" height="240" rx="16" fill="#161c30" stroke="#283254"/>
    <rect x="45" y="385" width="270" height="130" rx="12" fill="#0c101c"/>
    <text x="105" y="455" fill="#ec4899" font-size="14" font-weight="600">⚡ Quantum Watch V</text>
    <text x="45" y="545" fill="#ffffff" font-size="17" font-weight="700">Bio-Telemetry Wristwatch</text>
    <text x="45" y="575" fill="#10b981" font-size="20" font-weight="800">.00</text>
    <rect x="205" y="555" width="110" height="35" rx="8" fill="#6366f1"/>
    <text x="225" y="578" fill="#ffffff" font-size="12" font-weight="600">Add to Cart</text>

    <!-- Bottom Navigation Bar -->
    <rect x="0" y="640" width="360" height="80" rx="30" fill="#0f1424" stroke="#222a45"/>
    <text x="45" y="685" fill="#6366f1" font-size="22">🏠</text>
    <text x="130" y="685" fill="#94a3b8" font-size="22">🔍</text>
    <text x="215" y="685" fill="#94a3b8" font-size="22">🛒</text>
    <text x="300" y="685" fill="#94a3b8" font-size="22">⚙️</text>
  </g>
</svg>