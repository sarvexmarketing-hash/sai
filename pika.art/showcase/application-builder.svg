    <text x="20" y="70" fill="#f43f5e" font-size="12" font-family="monospace">import</text>
    <text x="70" y="70" fill="#cbd5e1" font-size="12" font-family="monospace">{ useState, useEffect } </text>
    <text x="245" y="70" fill="#f43f5e" font-size="12" font-family="monospace">from</text>
