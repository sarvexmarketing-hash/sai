<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" style="background:#0b0f19;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <!-- Window Container -->
  <rect x="40" y="35" width="1120" height="830" rx="16" fill="#111625" stroke="#1f273d" stroke-width="1.5"/>
  <!-- Header -->
  <rect x="40" y="35" width="1120" height="56" rx="16" fill="#161d31"/>
  <circle cx="74" cy="63" r="6" fill="#ef4444"/>
  <circle cx="96" cy="63" r="6" fill="#eab308"/>
  <circle cx="118" cy="63" r="6" fill="#22c55e"/>
  <text x="150" y="68" fill="#ffffff" font-size="16" font-weight="700">Sai CRM</text>
