    <text x="20" y="62" fill="#ffffff" font-size="24" font-weight="700">,840,000</text>
    <text x="175" y="62" fill="#10b981" font-size="12" font-weight="600">+22%</text>

    <rect x="270" y="0" width="250" height="80" rx="10" fill="#171f33" stroke="#25314f"/>
