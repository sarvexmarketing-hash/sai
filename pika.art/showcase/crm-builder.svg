  <!-- Column 4: Closed Won -->
  <g transform="translate(880, 215)">
    <rect x="0" y="0" width="250" height="620" rx="12" fill="#131a2c" stroke="#202942"/>
    <rect x="16" y="16" width="12" height="12" rx="6" fill="#10b981"/>
    <text x="36" y="27" fill="#ffffff" font-size="14" font-weight="600">Closed Won</text>
    <rect x="200" y="14" width="32" height="20" rx="10" fill="#1c253d"/>
    <text x="212" y="28" fill="#10b981" font-size="11">22</text>

    <!-- Card 1 -->
    <rect x="15" y="50" width="220" height="145" rx="8" fill="#162822" stroke="#1d4835"/>
    <text x="30" y="78" fill="#ffffff" font-size="14" font-weight="700">OmniCorp Global</text>
    <text x="30" y="102" fill="#34d399" font-size="18" font-weight="800">,000/yr</text>
