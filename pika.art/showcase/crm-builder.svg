  <!-- Column 3: Proposal Sent -->
  <g transform="translate(610, 215)">
    <rect x="0" y="0" width="250" height="620" rx="12" fill="#131a2c" stroke="#202942"/>
    <rect x="16" y="16" width="12" height="12" rx="6" fill="#f59e0b"/>
