<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" style="background:#0d0f17;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="wb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111424"/>
      <stop offset="100%" stop-color="#080a11"/>
    </linearGradient>
    <linearGradient id="hero-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2338"/>
      <stop offset="100%" stop-color="#131726"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="600" cy="350" r="260" fill="#6366f1" opacity="0.18" filter="url(#glow)"/>
  <circle cx="850" cy="550" r="200" fill="#ec4899" opacity="0.12" filter="url(#glow)"/>

  <!-- Browser Window Mockup -->
  <rect x="50" y="40" width="1100" height="820" rx="16" fill="url(#wb-bg)" stroke="#262b42" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <rect x="50" y="40" width="1100" height="56" rx="16" fill="#15192c"/>
  <circle cx="84" cy="68" r="7" fill="#ef4444"/>
  <circle cx="108" cy="68" r="7" fill="#eab308"/>
  <circle cx="132" cy="68" r="7" fill="#22c55e"/>
  
  <!-- URL Bar -->
  <rect x="350" y="52" width="500" height="32" rx="8" fill="#0d0f1d" stroke="#232840" stroke-width="1"/>
  <text x="380" y="73" fill="#94a3b8" font-size="13" font-family="monospace">https://nexus-saas.ai/landing-page</text>
  <rect x="865" y="58" width="65" height="20" rx="10" fill="#22c55e" fill-opacity="0.15"/>
  <text x="877" y="72" fill="#4ade80" font-size="11" font-weight="600">● LIVE</text>

  <!-- Inner Website Mockup -->
  <!-- Web Navbar -->
  <rect x="90" y="120" width="1020" height="60" rx="12" fill="#161a2e" stroke="#252b45" stroke-width="1"/>
  <text x="120" y="156" fill="#ffffff" font-size="18" font-weight="700" letter-spacing="0.5">NEXUS<tspan fill="#6366f1">.AI</tspan></text>
  <text x="420" y="155" fill="#cbd5e1" font-size="14" font-weight="500">Features</text>
  <text x="510" y="155" fill="#cbd5e1" font-size="14" font-weight="500">Solutions</text>
  <text x="605" y="155" fill="#cbd5e1" font-size="14" font-weight="500">Pricing</text>
  <text x="685" y="155" fill="#cbd5e1" font-size="14" font-weight="500">Docs</text>
  <rect x="970" y="132" width="120" height="36" rx="8" fill="#6366f1"/>
  <text x="992" y="155" fill="#ffffff" font-size="13" font-weight="600">Get Started</text>

  <!-- Hero Content -->
  <rect x="490" y="210" width="220" height="28" rx="14" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="1"/>
  <text x="508" y="229" fill="#a5b4fc" font-size="12" font-weight="600">✨ Next-Gen AI Web Builder</text>
  
  <text x="600" y="285" text-anchor="middle" fill="#ffffff" font-size="42" font-weight="800" letter-spacing="-0.5">
    Build Production-Ready Websites
  </text>
  <text x="600" y="335" text-anchor="middle" fill="url(#hero-grad)" font-size="42" font-weight="800" letter-spacing="-0.5">
    From Natural Language in Seconds
  </text>
  <text x="600" y="380" text-anchor="middle" fill="#94a3b8" font-size="16" font-weight="400">
    High-performance responsive components, automated SEO optimization, and instant global CDN deployment.
  </text>

  <!-- CTA Buttons -->
  <rect x="470" y="410" width="140" height="46" rx="10" fill="#6366f1"/>
  <text x="498" y="438" fill="#ffffff" font-size="14" font-weight="600">Start Free Trial</text>
  <rect x="625" y="410" width="130" height="46" rx="10" fill="#1e2338" stroke="#333a56" stroke-width="1"/>
  <text x="652" y="438" fill="#e2e8f0" font-size="14" font-weight="500">Live Demo ↗</text>

  <!-- 3 Showcase Cards -->
  <g transform="translate(90, 485)">
    <rect x="0" y="0" width="320" height="170" rx="12" fill="url(#card-grad)" stroke="#262d47" stroke-width="1"/>
    <rect x="20" y="20" width="44" height="44" rx="10" fill="#6366f1" fill-opacity="0.2"/>
    <text x="34" y="48" fill="#818cf8" font-size="20">⚡</text>
    <text x="20" y="95" fill="#ffffff" font-size="18" font-weight="700">100/100 Lighthouse</text>
    <text x="20" y="122" fill="#94a3b8" font-size="13" line-height="1.4">Zero bloat HTML, CSS &amp; Next.js bundles optimized for Core Web Vitals.</text>
  </g>

  <g transform="translate(440, 485)">
    <rect x="0" y="0" width="320" height="170" rx="12" fill="url(#card-grad)" stroke="#262d47" stroke-width="1"/>
    <rect x="20" y="20" width="44" height="44" rx="10" fill="#a855f7" fill-opacity="0.2"/>
    <text x="34" y="48" fill="#c084fc" font-size="20">📱</text>
    <text x="20" y="95" fill="#ffffff" font-size="18" font-weight="700">Fully Responsive</text>
    <text x="20" y="122" fill="#94a3b8" font-size="13">Adaptive fluid layouts for Mobile, Tablet, Desktop, and 4K Ultrawide screens.</text>
  </g>

  <g transform="translate(790, 485)">
    <rect x="0" y="0" width="320" height="170" rx="12" fill="url(#card-grad)" stroke="#262d47" stroke-width="1"/>
    <rect x="20" y="20" width="44" height="44" rx="10" fill="#ec4899" fill-opacity="0.2"/>
    <text x="34" y="48" fill="#f472b6" font-size="20">🛡️</text>
    <text x="20" y="95" fill="#ffffff" font-size="18" font-weight="700">Enterprise Security</text>
    <text x="20" y="122" fill="#94a3b8" font-size="13">Built-in SSL, DDoS mitigation, SOC2 compliance, and automated backups.</text>
  </g>

  <!-- Floating AI Copilot Widget -->
  <g transform="translate(420, 680)">
    <rect x="0" y="0" width="680" height="135" rx="14" fill="#101322" stroke="#4f46e5" stroke-width="1.5" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.6))"/>
    <circle cx="35" cy="35" r="16" fill="#4f46e5"/>
    <text x="27" y="41" fill="#ffffff" font-size="16">✨</text>
    <text x="65" y="34" fill="#ffffff" font-size="15" font-weight="600">Sai AI Software Engineer</text>
    <text x="65" y="54" fill="#818cf8" font-size="12">Synthesizing component tree...</text>
    
    <rect x="25" y="75" width="490" height="42" rx="8" fill="#1a1f33" stroke="#2d3554" stroke-width="1"/>
    <text x="40" y="101" fill="#e2e8f0" font-size="13" font-family="monospace">"Add pricing toggle with annual 20% discount and Stripe checkout"</text>
    
    <rect x="528" y="75" width="135" height="42" rx="8" fill="#22c55e"/>
    <text x="545" y="101" fill="#ffffff" font-size="13" font-weight="600">Generate Site 🚀</text>
  </g>
</svg>