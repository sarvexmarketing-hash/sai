<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" style="background:#0a0c16;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <!-- Window -->
  <rect x="40" y="35" width="1120" height="830" rx="16" fill="#101322" stroke="#1d233c" stroke-width="1.5"/>
  <!-- Header -->
  <rect x="40" y="35" width="1120" height="56" rx="16" fill="#14192b"/>
  <circle cx="74" cy="63" r="6" fill="#ef4444"/>
  <circle cx="96" cy="63" r="6" fill="#eab308"/>
  <circle cx="118" cy="63" r="6" fill="#22c55e"/>
  <text x="150" y="68" fill="#ffffff" font-size="16" font-weight="700">Sai ERP Suite</text>
  <text x="260" y="68" fill="#64748b" font-size="14">/ Integrated Operations, Inventory &amp; Finance</text>
  <rect x="990" y="48" width="150" height="30" rx="6" fill="#4f46e5"/>
  <text x="1010" y="68" fill="#ffffff" font-size="12" font-weight="600">Execute Payroll</text>

  <!-- 4 Module Sections -->
  <!-- Module 1: Supply Chain & Inventory -->
  <g transform="translate(70, 115)">
    <rect x="0" y="0" width="515" height="340" rx="12" fill="#14182b" stroke="#222a47"/>
    <text x="25" y="38" fill="#ffffff" font-size="16" font-weight="700">📦 Inventory &amp; Supply Chain Analytics</text>
    <text x="25" y="58" fill="#94a3b8" font-size="12">Global Multi-Warehouse Stock Fulfillment (4 Facilities)</text>

    <rect x="25" y="85" width="220" height="75" rx="8" fill="#1c223a"/>
    <text x="40" y="112" fill="#94a3b8" font-size="12">Total SKUs In Stock</text>
    <text x="40" y="142" fill="#ffffff" font-size="22" font-weight="700">142,500 Units</text>

    <rect x="265" y="85" width="220" height="75" rx="8" fill="#1c223a"/>
    <text x="280" y="112" fill="#94a3b8" font-size="12">Fulfillment Rate</text>
    <text x="280" y="142" fill="#10b981" font-size="22" font-weight="700">99.4% (Optimal)</text>

    <!-- Inventory table preview -->
    <rect x="25" y="180" width="465" height="135" rx="8" fill="#0d101c"/>
    <text x="40" y="208" fill="#64748b" font-size="11" font-weight="600">SKU ID</text>
    <text x="150" y="208" fill="#64748b" font-size="11" font-weight="600">PRODUCT NAME</text>
    <text x="330" y="208" fill="#64748b" font-size="11" font-weight="600">QTY</text>
    <text x="410" y="208" fill="#64748b" font-size="11" font-weight="600">STATUS</text>

    <line x1="25" y1="220" x2="490" y2="220" stroke="#1b2137"/>
    <text x="40" y="245" fill="#cbd5e1" font-size="12" font-family="monospace">NX-9901</text>
    <text x="150" y="245" fill="#e2e8f0" font-size="12">Server Blade Cluster X1</text>
    <text x="330" y="245" fill="#cbd5e1" font-size="12">4,200</text>
    <text x="410" y="245" fill="#10b981" font-size="11" font-weight="600">In Stock</text>

    <text x="40" y="285" fill="#cbd5e1" font-size="12" font-family="monospace">NX-4412</text>
    <text x="150" y="285" fill="#e2e8f0" font-size="12">Optical Switch 400G</text>
    <text x="330" y="285" fill="#cbd5e1" font-size="12">820</text>
    <text x="410" y="285" fill="#eab308" font-size="11" font-weight="600">Reorder</text>
  </g>

  <!-- Module 2: Financial & Ledger -->
  <g transform="translate(615, 115)">
    <rect x="0" y="0" width="515" height="340" rx="12" fill="#14182b" stroke="#222a47"/>
    <text x="25" y="38" fill="#ffffff" font-size="16" font-weight="700">💳 Finance &amp; Automated Ledger</text>
    <text x="25" y="58" fill="#94a3b8" font-size="12">Realtime P&amp;L, Balance Sheet, Tax Audits</text>

    <!-- Bar chart of monthly revenue vs costs -->
    <g transform="translate(25, 90)">
      <rect x="0" y="0" width="465" height="225" rx="8" fill="#1c223a"/>
      <!-- Month Bars -->
      <rect x="50" y="60" width="24" height="120" fill="#3b82f6" rx="4"/>
      <rect x="80" y="90" width="24" height="90" fill="#64748b" rx="4"/>

      <rect x="130" y="45" width="24" height="135" fill="#3b82f6" rx="4"/>
      <rect x="160" y="85" width="24" height="95" fill="#64748b" rx="4"/>

      <rect x="210" y="30" width="24" height="150" fill="#3b82f6" rx="4"/>
      <rect x="240" y="80" width="24" height="100" fill="#64748b" rx="4"/>

      <rect x="290" y="20" width="24" height="160" fill="#10b981" rx="4"/>
      <rect x="320" y="75" width="24" height="105" fill="#64748b" rx="4"/>

      <text x="55" y="200" fill="#94a3b8" font-size="11">Q1</text>
      <text x="135" y="200" fill="#94a3b8" font-size="11">Q2</text>
      <text x="215" y="200" fill="#94a3b8" font-size="11">Q3</text>
      <text x="295" y="200" fill="#94a3b8" font-size="11">Q4 (Est)</text>

      <rect x="360" y="30" width="90" height="40" rx="6" fill="#131728"/>
      <text x="370" y="55" fill="#10b981" font-size="13" font-weight="700">+38% Net</text>
    </g>
  </g>

  <!-- Module 3: Human Resources & Payroll -->
  <g transform="translate(70, 485)">
    <rect x="0" y="0" width="515" height="340" rx="12" fill="#14182b" stroke="#222a47"/>
    <text x="25" y="38" fill="#ffffff" font-size="16" font-weight="700">👥 Human Resources &amp; Talent</text>
    <text x="25" y="58" fill="#94a3b8" font-size="12">384 Global Employees across 12 Countries</text>

    <rect x="25" y="85" width="465" height="225" rx="8" fill="#1c223a"/>
    <text x="40" y="120" fill="#ffffff" font-size="14" font-weight="600">Payroll Run - November 2026</text>
    <text x="40" y="145" fill="#10b981" font-size="24" font-weight="700">,420,500.00</text>
    <text x="40" y="170" fill="#94a3b8" font-size="12">Status: Fully Reconciled with Direct Deposit &amp; Benefits</text>

    <rect x="40" y="195" width="430" height="35" rx="6" fill="#0d101c"/>
    <text x="55" y="217" fill="#cbd5e1" font-size="12">Engineering: 148 staff • Sales: 92 staff • Ops: 144 staff</text>

    <rect x="40" y="245" width="130" height="32" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981"/>
    <text x="55" y="266" fill="#34d399" font-size="12" font-weight="600">✓ SOC2 Audited</text>
  </g>

  <!-- Module 4: Procurement & Operations -->
  <g transform="translate(615, 485)">
    <rect x="0" y="0" width="515" height="340" rx="12" fill="#14182b" stroke="#222a47"/>
    <text x="25" y="38" fill="#ffffff" font-size="16" font-weight="700">⚙️ Procurement &amp; Vendor Management</text>
    <text x="25" y="58" fill="#94a3b8" font-size="12">Real-time Purchase Orders &amp; Vendor SLA Monitoring</text>

    <rect x="25" y="85" width="465" height="225" rx="8" fill="#1c223a"/>
    
    <g transform="translate(40, 105)">
      <text x="0" y="20" fill="#ffffff" font-size="13" font-weight="600">PO-88192 — AWS Cloud Infrastructure</text>
      <text x="0" y="38" fill="#94a3b8" font-size="11">,100 • Approved by CFO</text>
      <rect x="350" y="5" width="80" height="22" rx="4" fill="#10b981"/>
      <text x="362" y="20" fill="#ffffff" font-size="11" font-weight="600">PAID</text>
    </g>

    <line x1="25" y1="160" x2="490" y2="160" stroke="#283254"/>

    <g transform="translate(40, 180)">
      <text x="0" y="20" fill="#ffffff" font-size="13" font-weight="600">PO-88193 — Datacenter Fiber Connectivity</text>
      <text x="0" y="38" fill="#94a3b8" font-size="11">,400 • Net-30 Terms</text>
      <rect x="350" y="5" width="80" height="22" rx="4" fill="#3b82f6"/>
      <text x="357" y="20" fill="#ffffff" font-size="11" font-weight="600">IN ROUTE</text>
    </g>

    <line x1="25" y1="235" x2="490" y2="235" stroke="#283254"/>

    <g transform="translate(40, 250)">
      <text x="0" y="20" fill="#ffffff" font-size="13" font-weight="600">PO-88194 — Nvidia GPU Acceleration Cluster</text>
      <text x="0" y="38" fill="#94a3b8" font-size="11">,000 • Security review passed</text>
      <rect x="350" y="5" width="80" height="22" rx="4" fill="#eab308" fill-opacity="0.2"/>
      <text x="355" y="20" fill="#eab308" font-size="11" font-weight="600">QUEUED</text>
    </g>
  </g>
</svg>